<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜地咖啡&万物生长酒馆 | 留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', 'SimSun', serif;
        }

        body {
            background-color: #d82626;
            color: #ffffff;
            line-height: 1.6;
        }

        /* 修复导航栏布局 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            background-color: #d82626;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            color: #ffffff;
            font-weight: 900;
            font-size: 1.5rem;
            font-family: 'Times New Roman', serif;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #ffcc00;
        }

        .hero {
            padding: 5rem 4rem;
            text-align: center;
            background-color: #d82626;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero .highlight {
            color: #ffffff;
            font-family: 'SimSun', serif;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .message-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 900;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #ffcc00;
            display: inline-block;
            color: #ffffff;
        }

        .message-form {
            background: rgba(255,255,255,0.05);
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            margin-bottom: 4rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            color: #ffffff;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .submit-btn {
            background-color: #ffffff;
            color: #d82626;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #f1f1f1;
        }

        .messages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .message-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 2rem;
            position: relative;
            transition: transform 0.3s;
        }

        .message-card:hover {
            transform: translateY(-5px);
            border-left: 4px solid #ffcc00;
        }

        .message-author {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            font-family: 'SimSun', serif;
        }

        .message-date {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
        }

        .message-content {
            color: #ffffff;
            line-height: 1.7;
            font-family: 'SimSun', serif;
        }

        .del-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.8rem;
            color: #ffcc00;
            cursor: pointer;
            display: none;
        }

        .message-card.my-msg .del-btn {
            display: inline-block;
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            background-color: #d82626;
            margin-top: 4rem;
            color: #ffffff;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-family: 'SimSun', serif;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">SEED CAFE & NATUREBAR</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Message</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to<br><span class="highlight">喜地咖啡 & 万物生长酒馆</span></h1>
        <p>but poetry, beauty, romance, love, these are what we stay alive for</p>
    </section>

    <section class="message-section">
        <h2 class="section-title">留言板</h2>

        <!-- 修复表单ID -->
        <form class="message-form" id="msgForm">
            <div class="form-group">
                <label>你的昵称</label>
                <input type="text" id="nick" placeholder="请输入你的昵称" required>
            </div>
            <div class="form-group">
                <label>你的留言</label>
                <textarea id="content" rows="4" placeholder="写下你的感受..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">提交留言</button>
        </form>

        <div class="messages-grid" id="msgList"></div>
    </section>

    <footer>
        © 2026 喜地咖啡 & 万物生长酒馆 | 保留所有权利
    </footer>

    <script>
        // 免费云端存储 JSONBin 公共配置
        const binUrl = "https://api.jsonbin.io/v3/b/684c74c2acd3cb34a887c983";
        const masterKey = "$2a$10$xXQd1yW6R6QyH6kF5Z0W/.e4t5G6H7J8K9L0M1N2O3P4Q5R6S7T8U9V0W";

        let myNick = localStorage.getItem("myNick") || "";

        // 渲染所有留言
        async function renderMsgs() {
            const res = await fetch(binUrl);
            const data = await res.json();
            const list = data.record.msgs || [];
            msgList.innerHTML = "";

            list.forEach((item, idx) => {
                const isMine = item.nick === myNick;
                const card = document.createElement("div");
                card.className = "message-card " + (isMine ? "my-msg" : "");
                card.innerHTML = `
                    <div class="message-author">${item.nick}</div>
                    <div class="message-date">${item.date}</div>
                    <div class="message-content">${item.content}</div>
                    <span class="del-btn" data-idx="${idx}">删除</span>
                `;
                msgList.appendChild(card);
            });

            // 绑定删除事件
            document.querySelectorAll(".del-btn").forEach(btn => {
                btn.onclick = async function () {
                    if(!confirm("确定要删除这条留言吗？")) return;
                    const idx = this.dataset.idx;
                    await delMsg(idx);
                };
            });
        }

        // 删除留言
        async function delMsg(delIndex) {
            const res = await fetch(binUrl);
            const data = await res.json();
            let list = data.record.msgs || [];
            list.splice(delIndex, 1);

            await fetch(binUrl, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": masterKey
                },
                body: JSON.stringify({ msgs: list })
            });
            renderMsgs();
        }

        // 提交留言（修复事件绑定）
        document.getElementById("msgForm").onsubmit = async function (e) {
            e.preventDefault();
            const nick = document.getElementById("nick").value.trim();
            const content = document.getElementById("content").value.trim();
            if(!nick || !content) return alert("请填写昵称和留言");

            myNick = nick;
            localStorage.setItem("myNick", nick);

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

            const newMsg = { nick, date: dateStr, content };

            const res = await fetch(binUrl);
            const data = await res.json();
            let list = data.record.msgs || [];
            list.unshift(newMsg);

            await fetch(binUrl, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": masterKey
                },
                body: JSON.stringify({ msgs: list })
            });

            this.reset();
            renderMsgs();
            alert("留言发布成功！");
        };

        // 初始化
        window.onload = renderMsgs;
    </script>
</body>
</html>
