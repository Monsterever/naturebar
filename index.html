<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜地咖啡&万物生长酒馆 | 留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', 'SimSun', serif;
        }

        body {
            background-color: #d82626;
            color: #ffffff;
            line-height: 1.6;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            background-color: #d82626;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            color: #ffffff;
            font-weight: 900;
            font-size: 1.5rem;
            font-family: 'Times New Roman', serif;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #ffcc00;
        }

        .hero {
            padding: 5rem 4rem;
            text-align: center;
            background-color: #d82626;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero .highlight {
            color: #ffffff;
            font-family: 'SimSun', serif;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .message-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 900;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #ffcc00;
            display: inline-block;
            color: #ffffff;
        }

        .message-form {
            background: rgba(255,255,255,0.05);
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            margin-bottom: 4rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            color: #ffffff;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .submit-btn {
            background-color: #ffffff;
            color: #d82626;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .messages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .message-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 2rem;
            position: relative;
        }

        .message-author {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .message-date {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
        }

        .message-content {
            line-height: 1.7;
            color: #fff;
        }

        .del-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.8rem;
            color: #ffcc00;
            cursor: pointer;
            display: none;
        }

        .message-card.my-msg .del-btn {
            display: inline-block;
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            background-color: #d82626;
            margin-top: 4rem;
            color: #ffffff;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">SEED CAFE & NATUREBAR</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Message</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to<br><span class="highlight">喜地咖啡 & 万物生长酒馆</span></h1>
        <p>but poetry, beauty, romance, love, these are what we stay alive for</p>
    </section>

    <section class="message-section">
        <h2 class="section-title">留言板</h2>

        <form class="message-form" id="msgForm">
            <div class="form-group">
                <label>你的昵称</label>
                <input type="text" id="nick" placeholder="请输入你的昵称" required>
            </div>
            <div class="form-group">
                <label>你的留言</label>
                <textarea id="content" rows="4" placeholder="写下你的感受..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">提交留言</button>
        </form>

        <div class="messages-grid" id="msgList"></div>
    </section>

    <footer>
        © 2026 喜地咖啡 & 万物生长酒馆 | 保留所有权利
    </footer>

    <script>
        // 本地存储，先保证能用、不报错、可提交、可删自己
        let myNick = localStorage.getItem("myNick") || "";
        let messages = JSON.parse(localStorage.getItem("localMessages")) || [
            {nick:"咖啡爱好者",date:"2026-05-14",content:"欢迎来到喜地咖啡 & 万物生长酒馆～"}
        ];

        function render() {
            const wrap = document.getElementById("msgList");
            wrap.innerHTML = "";
            messages.forEach((item,idx)=>{
                let isMine = item.nick === myNick;
                let card = document.createElement("div");
                card.className = "message-card " + (isMine?"my-msg":"");
                card.innerHTML = `
                    <div class="message-author">${item.nick}</div>
                    <div class="message-date">${item.date}</div>
                    <div class="message-content">${item.content}</div>
                    <span class="del-btn" data-i="${idx}">删除</span>
                `;
                wrap.appendChild(card);
            });

            // 删除
            document.querySelectorAll(".del-btn").forEach(btn=>{
                btn.onclick = function(){
                    let idx = this.dataset.i;
                    if(confirm("确定删除？")){
                        messages.splice(idx,1);
                        localStorage.setItem("localMessages",JSON.stringify(messages));
                        render();
                    }
                }
            });
        }

        // 提交
        document.getElementById("msgForm").addEventListener("submit",function(e){
            e.preventDefault();
            let nick = document.getElementById("nick").value.trim();
            let cont = document.getElementById("content").value.trim();
            if(!nick||!cont){
                alert("请填写昵称和留言");
                return;
            }
            myNick = nick;
            localStorage.setItem("myNick",myNick);

            let d = new Date();
            let dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            messages.unshift({nick:myNick,date:dateStr,content:cont});
            localStorage.setItem("localMessages",JSON.stringify(messages));

            this.reset();
            render();
            alert("留言提交成功！");
        });

        window.onload = render;
    </script>
</body>
</html>
