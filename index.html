<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜地咖啡&万物生长酒馆 | 留言板</title>
    <!-- Twikoo 免费评论系统 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/twikoo@1.6.16/dist/twikoo.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', 'SimSun', serif;
        }

        body {
            background-color: #d82626;
            color: #ffffff;
            line-height: 1.6;
        }

        .navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #d82626;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .logo {
            color: #ffffff;
            font-weight: 900;
            font-size: 1.25rem;
            font-family: 'Times New Roman', serif;
        }

        .nav-links {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #ffcc00;
        }

        .hero {
            padding: 3rem 1.5rem;
            text-align: center;
            background-color: #d82626;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero .highlight {
            color: #ffffff;
            font-family: 'SimSun', serif;
        }

        .hero p {
            font-size: 1rem;
            max-width: 700px;
            margin: 0 auto;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .message-section {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 900;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #ffcc00;
            display: inline-block;
            color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            background-color: #d82626;
            margin-top: 3rem;
            color: #ffffff;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-family: 'SimSun', serif;
            font-size: 0.9rem;
        }

        /* 让 Twikoo 适配你的红色主题 */
        #twikoo {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 1.5rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">SEED CAFE & NATUREBAR</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Message</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to<br><span class="highlight">喜地咖啡 & 万物生长酒馆</span></h1>
        <p>but poetry, beauty, romance, love, these are what we stay alive for</p>
    </section>

    <section class="message-section">
        <h2 class="section-title">留言板</h2>

        <!-- 👇 这里就是全世界共用的留言板 -->
        <div id="twikoo"></div>
    </section>

    <footer>
        © 2026 喜地咖啡 & 万物生长酒馆 | 保留所有权利
    </footer>

    <!-- Twikoo 免费评论系统 JS -->
    <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.16/dist/twikoo.min.js"></script>
    <script>
        twikoo.init({
          envId: "https://twikoo.vercel.app", // 免费公共服务器
          el: "#twikoo"
        })
    </script>

</body>
</html>
